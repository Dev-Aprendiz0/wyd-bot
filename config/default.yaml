# ============================================================
# WYD Bot - Legends of Midgard
# Configuração Padrão
# ============================================================
# IMPORTANTE: Ajuste as regiões de HP/MP de acordo com a
# resolução do seu jogo. Use o modo de calibração:
#   wyd-bot --calibrate
# ============================================================

# Título da janela do WYD (usado para localizar o jogo)
game_window_title: "With Your Destiny"

# FPS de captura de tela (10 é suficiente para a maioria das ações)
capture_fps: 10

# Intervalo entre decisões do bot (em segundos)
decision_interval: 0.1

# Arquivo de log
log_file: "logs/wyd_bot.log"

# Salvar screenshot quando ocorrer erro
screenshot_on_error: true

# Hotkeys
hotkey_toggle: "f9"   # Pausar/continuar
hotkey_stop: "f10"    # Parar o bot

# ============================================================
# Barras de HP / MP
# ============================================================
# CALIBRAÇÃO NECESSÁRIA: As regiões abaixo são exemplos.
# Execute wyd-bot --calibrate e use a screenshot para
# identificar as coordenadas corretas das barras.
# ============================================================
hp_mp:
  hp_region:
    x: 90
    y: 8
    width: 150
    height: 12
  mp_region:
    x: 90
    y: 24
    width: 150
    height: 12
  # Cor da barra de HP em HSV (vermelho)
  hp_color_lower: [0, 100, 100]
  hp_color_upper: [10, 255, 255]
  # Cor da barra de MP em HSV (azul)
  mp_color_lower: [100, 100, 100]
  mp_color_upper: [130, 255, 255]

# ============================================================
# Combate
# ============================================================
combat:
  attack_key: "space"
  skill_keys: ["1", "2", "3", "4"]
  skill_cooldowns: [2.0, 3.0, 5.0, 8.0]
  target_key: "tab"
  hp_heal_threshold: 0.5      # Usar poção de HP quando < 50%
  mp_heal_threshold: 0.3      # Usar poção de MP quando < 30%
  hp_potion_key: "f1"
  mp_potion_key: "f2"
  hp_emergency_threshold: 0.2 # Emergência quando HP < 20%
  flee_key: "escape"

# ============================================================
# Farm
# ============================================================
farm:
  farm_radius: 200
  loot_enabled: true
  loot_key: "z"
  auto_target: true
  walk_pattern: "circular"     # circular, square, random
  walk_delay: 0.5
  max_idle_time: 10.0
  return_to_center: true

# ============================================================
# Detecção Visual
# ============================================================
detection:
  monster_template_dir: "templates/monsters"
  item_template_dir: "templates/items"
  detection_threshold: 0.7
  npc_detection_enabled: true
  minimap_region:
    x: 0
    y: 0
    width: 0
    height: 0
